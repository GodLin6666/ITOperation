# ============================================================
# 多台 GPU 推理机的负载均衡（nginx 配置）
#
# 适用场景：数据只有一份（在应用服务器上），但模型推理想用多台 GPU 机器跑。
#
#   ┌──── 应用服务器（唯一的数据所在地）────┐
#   │  nginx:8000 → backend → MySQL        │
#   │                    │                 │
#   │                    └→ nginx:11434 ───┼──┬→ GPU机A (Ollama)
#   └──────────────────────────────────────┘  ├→ GPU机B (Ollama)
#                                             └→ GPU机C (Ollama)
#
# 用法：
#   1) 在一台机器上装 nginx，把本文件放进 conf.d/
#   2) 把下面 upstream 里的 IP 改成你实际的 GPU 机器
#   3) 应用服务器 .env 里设：
#        OPSAI_OLLAMA_BASE_URL=http://nginx所在机器:11434
#
# ⚠️ 前提：每台 GPU 机都要
#     - 装好 Ollama 并 pull 了同样的两个模型（qwen2.5 + bge-m3）
#     - 设了 OLLAMA_HOST=0.0.0.0:11434
#     - 防火墙只允许这台 nginx 的 IP 访问 11434
# ============================================================

upstream ollama_cluster {
    # least_conn：把新请求交给当前连接数最少的节点。
    # 对这个场景比轮询更合适 —— 一次生成要几十秒，谁的活少就给谁。
    least_conn;

    # ↓↓↓ 改成你实际的 GPU 机器 ↓↓↓
    server 192.168.1.101:11434 max_fails=2 fail_timeout=30s;
    server 192.168.1.102:11434 max_fails=2 fail_timeout=30s;
    # server 192.168.1.103:11434 max_fails=2 fail_timeout=30s;   # 加机器就加一行

    # 长连接复用，减少频繁建连的开销
    keepalive 32;
}

server {
    # 对外提供的就是这个端口，应用服务器的 OPSAI_OLLAMA_BASE_URL 指向它
    listen 11434;

    # 只允许应用服务器访问（改成本机应用服务器的 IP 或网段）
    # allow 192.168.1.10;
    # deny all;

    location / {
        proxy_pass http://ollama_cluster;

        # Ollama 用的是 HTTP/1.1 的 chunked 流式输出，必须这样配
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 关键：关闭缓冲，否则流式输出会被 nginx 攒着，首字延迟会变得很长
        proxy_buffering off;
        proxy_cache off;

        # 一次生成可能要几十秒，超时要比应用层（300 秒）更宽
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
