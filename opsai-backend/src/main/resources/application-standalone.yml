# ============================================================
# 桌面版（exe）专用配置
#
# 启用方式： java -jar opsai-standalone.jar --spring.profiles.active=standalone
#            （打包成 exe 后由启动器自动带上这个参数）
#
# 和默认配置的区别：
#   1. 数据库换成内嵌 H2（文件存在用户目录，不用装 MySQL）
#   2. 表由 Hibernate 自动创建（ddl-auto: update），不用跑 init.sql
#   3. 上传目录放到用户目录，避免 exe 所在目录没有写权限
#   4. 打开 opsai.standalone 开关：启动后自动开浏览器 + 首次自动导入知识库
#
# 前置条件：本机已安装并运行 Ollama（模型 qwen2.5 + bge-m3），这是唯一的外部依赖。
# ============================================================

spring:
  datasource:
    # H2 文件库，数据落在 %USERPROFILE%\opsai-data\ 下，卸载 exe 也不会丢
    url: jdbc:h2:file:${user.home}/opsai-data/opsai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update          # 桌面版第一次启动时自动建表
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false            # 桌面版不需要暴露 H2 控制台

opsai:
  # 打开桌面版行为：自动开浏览器、首次自动灌知识库
  standalone: true

  storage:
    upload-dir: ${user.home}/opsai-data/logs

# 桌面版是 GUI 程序，没有控制台窗口，所以必须把日志写到文件，
# 出问题时用户可以在 %USERPROFILE%\opsai-data\opsai.log 里看到原因
logging:
  file:
    name: ${user.home}/opsai-data/opsai.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 3
